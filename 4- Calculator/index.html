<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>

body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f2f2f2;
    font-family:Arial, Helvetica, sans-serif;
}

.calculator{
    width:340px;
    background:#222;
    padding:20px;
    border-radius:10px;
}

#display{
    width:100%;
    height:60px;
    margin-bottom:15px;
    font-size:28px;
    text-align:right;
    padding-right:10px;
    box-sizing:border-box;
    border:none;
    border-radius:5px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    padding:18px;
    font-size:20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.operator{
    background:orange;
    color:white;
}

.equal{
    background:green;
    color:white;
}

.clear{
    background:#ff4d4d;
    color:white;
}

.zero{
    grid-column:span 4;
}

</style>
</head>

<body>

<div class="calculator">

<input type="text" id="display" value="0" readonly>

<div class="buttons">

<button class="clear">C</button>
<button class="operator">÷</button>
<button class="operator">×</button>
<button class="operator">−</button>

<button>7</button>
<button>8</button>
<button>9</button>
<button class="operator">+</button>

<button>4</button>
<button>5</button>
<button>6</button>
<button>.</button>

<button>1</button>
<button>2</button>
<button>3</button>
<button class="equal">=</button>

<button class="zero">0</button>

</div>

</div>

<script src="calculator.js" defer></script>

</body>
</html>
